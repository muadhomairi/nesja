name: NESJA.OS Commercial
on:
  pull_request:
    paths: ["nesja-os/**", ".github/workflows/nesja-os.yml"]
  push:
    branches: [main]
    paths: ["nesja-os/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nesja-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nesja-os/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Database tests (migrations, RLS, tenant isolation, demo reconciliation)
        run: PGBIN=/usr/lib/postgresql/16/bin npm run test:db
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
